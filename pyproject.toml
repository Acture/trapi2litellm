[build-system]
requires = ["maturin==1.12.6"]
build-backend = "maturin"

[project]
name = "trapi2litellm"
version = "0.1.0"
description = "Managed-identity TRAPI discovery and a local LiteLLM gateway"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "litellm[proxy]==1.99.0",
  "azure-identity==1.25.3",
  "gunicorn==23.0.0",
  "uvicorn-worker==0.4.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "starlette==1.6.0",
]

[project.urls]
Repository = "https://github.com/Acture/trapi2litellm"

[tool.maturin]
bindings = "bin"
python-source = "src"
module-name = "trapi2litellm"
locked = true
editable-profile = "dev"
include = [
  { path = "tests/**", format = "sdist" },
  { path = "packaging/**", format = "sdist" },
  { path = "docs/**", format = "sdist" },
  { path = "STATUS.md", format = "sdist" },
  { path = "uv.lock", format = "sdist" },
  { path = "rustfmt.toml", format = "sdist" },
]
exclude = ["notes/**", ".superpowers/**", "experiments/**"]

[dependency-groups]
dev = ["ruff==0.15.6", "ty"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/trapi2litellm/gateway_app.py" = ["E402"]
