[project]
name = "trapi2litellm"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "litellm[proxy]==1.99.0",
  "azure-identity==1.25.3",
  "gunicorn==23.0.0",
  "uvicorn-worker==0.4.0",
]

[dependency-groups]
dev = ["ruff==0.15.6"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"gateway_app.py" = ["E402"]
