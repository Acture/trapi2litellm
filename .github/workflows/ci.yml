name: Package acceptance

on:
  push:
    branches: ["**"]
    paths-ignore: ["STATUS.md"]
  pull_request:
    paths-ignore: ["STATUS.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LITELLM_LOCAL_MODEL_COST_MAP: "True"

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install fish
        shell: python
        run: |
          import subprocess
          subprocess.run(["sudo", "apt-get", "update"], check=True)
          subprocess.run(["sudo", "apt-get", "install", "-y", "fish"], check=True)
      - name: Lint, types and offline tests
        shell: fish {0}
        run: |
          uv sync --frozen
          uv run --frozen ruff check .; or exit
          uv run --frozen ruff format --check .; or exit
          uv run --frozen ty check; or exit
          uv run --frozen python -m unittest discover -s tests -v; or exit
      - name: Build distributions
        shell: fish {0}
        run: uv build
      - if: matrix.python == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  dist:
    name: Installed distributions (${{ matrix.runner }})
    needs: python
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Install fish and start user manager
        shell: python
        run: |
          import os, subprocess
          subprocess.run(["sudo", "apt-get", "update"], check=True)
          subprocess.run(["sudo", "apt-get", "install", "-y", "fish"], check=True)
          subprocess.run(["sudo", "loginctl", "enable-linger", os.environ["USER"]], check=True)
          subprocess.run(["sudo", "systemctl", "start", f"user@{os.getuid()}.service"], check=True)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"XDG_RUNTIME_DIR=/run/user/{os.getuid()}\n")
      - name: Wheel, sdist, uvx and persistent uv tool acceptance
        shell: fish {0}
        run: |
          mkdir -p "$RUNNER_TOOL_CACHE/trapi2litellm-acceptance"
          uv run --frozen python packaging/check_dist.py --python (uv python find 3.12) --tool-root "$RUNNER_TOOL_CACHE/trapi2litellm-acceptance"

  deb:
    name: Debian lifecycle (${{ matrix.base }}, ${{ matrix.runner }})
    needs: [python, dist]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        base: ["debian:13", "ubuntu:24.04"]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Install fish
        shell: python
        run: |
          import subprocess
          subprocess.run(["sudo", "apt-get", "update"], check=True)
          subprocess.run(["sudo", "apt-get", "install", "-y", "fish"], check=True)
      - name: Build on target system and architecture
        shell: fish {0}
        env:
          BASE: ${{ matrix.base }}
        run: |
          docker build --build-arg BASE="$BASE" -f packaging/Dockerfile -t trapi2litellm-builder .; or exit
          docker run --rm --volume "$PWD:/src" trapi2litellm-builder python3 packaging/build_deb.py dist/trapi2litellm-*.tar.gz --out debs; or exit
          # The earlier Debian revision has the same payload; only its package
          # version is older. This tests normal dpkg version-based upgrading.
          docker run --rm --volume "$PWD:/src" trapi2litellm-builder python3 packaging/build_deb.py dist/trapi2litellm-*.tar.gz --out debs-old --revision 0~acceptance1; or exit
      - name: Offline install, service restart after upgrade, remove and purge
        shell: fish {0}
        run: |
          docker run --detach --name trapi2litellm-acceptance --privileged --network none --tmpfs /run --tmpfs /run/lock --volume "$PWD:/src" trapi2litellm-builder /sbin/init; or exit
          docker exec trapi2litellm-acceptance python3 packaging/check_deb.py (string replace "$PWD" /src -- debs-old/*.deb) (string replace "$PWD" /src -- debs/*.deb)
      - if: always()
        shell: fish {0}
        run: |
          if docker container inspect trapi2litellm-acceptance >/dev/null 2>&1
            docker rm --force trapi2litellm-acceptance
          end
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ strategy.job-index }}
          path: debs/
          if-no-files-found: error
